<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradiente de fundo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e4040"/>
      <stop offset="100%" stop-color="#1a6b6b"/>
    </linearGradient>
    <!-- Gradiente da linha decorativa -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Filtro de suavidade para círculos decorativos -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Círculos decorativos (efeito glow) -->
  <circle cx="1050" cy="120" r="200" fill="#1a6b6b" opacity="0.3" filter="url(#blur)"/>
  <circle cx="150" cy="520" r="150" fill="#0e4040" opacity="0.4" filter="url(#blur)"/>
  <circle cx="600" cy="315" r="300" fill="#ffffff" opacity="0.03" filter="url(#blur)"/>

  <!-- Grade sutil de pontos -->
  <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.08"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Linha decorativa horizontal -->
  <rect x="0" y="1" width="1200" height="2" fill="url(#accent)"/>

  <!-- Monograma / ícone grande decorativo (canto direito) -->
  <text x="1060" y="420" font-family="Georgia, serif" font-size="340" fill="#ffffff" opacity="0.04"
        text-anchor="middle" font-weight="bold">I</text>

  <!-- Badge categoria (canto superior esquerdo) -->
  <rect x="60" y="60" width="12" height="52" rx="6" fill="#ffffff" opacity="0.9"/>

  <!-- Logotipo TYNA -->
  <text x="88" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" fill="#ffffff" opacity="0.7" letter-spacing="8" font-weight="300">TYNA</text>
  <text x="88" y="112" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="12" fill="#ffffff" opacity="0.45" letter-spacing="3">IA &amp; GOVERNANÇA</text>

  <!-- Título do cluster (elemento principal) -->
  <text x="88" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="72" fill="#ffffff" font-weight="700" letter-spacing="-1">Implementação de IA</text>

  <!-- Subtítulo -->
  <text x="88" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" fill="#ffffff" opacity="0.6" letter-spacing="1">tyna.com.br</text>

  <!-- Linha separadora antes do título -->
  <rect x="88" y="270" width="80" height="3" rx="1.5" fill="#ffffff" opacity="0.5"/>

  <!-- Rótulo "Artigo" -->
  <text x="88" y="258" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" fill="#ffffff" opacity="0.5" letter-spacing="4" font-weight="500">ARTIGO</text>
</svg>